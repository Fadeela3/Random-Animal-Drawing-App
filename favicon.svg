<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#f5f0e8"/>
  <!-- pencil body -->
  <rect x="42" y="10" width="16" height="58" rx="3" fill="#c0502a"/>
  <!-- pencil tip -->
  <polygon points="42,68 58,68 50,85" fill="#ece5d4"/>
  <!-- pencil eraser -->
  <rect x="42" y="10" width="16" height="12" rx="3" fill="#e8795a"/>
  <!-- pencil tip point -->
  <polygon points="46,82 54,82 50,90" fill="#1c1612"/>
  <!-- shine line -->
  <rect x="52" y="14" width="4" height="50" rx="2" fill="#e8795a" opacity="0.4"/>
</svg>
